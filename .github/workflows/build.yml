name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: unzip -o ScanHelper.zip

      - name: Build APK
        working-directory: ScanHelper
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ScanHelper-apk
          path: ScanHelper/app/build/outputs/apk/debug/app-debug.apk

      # टेस्ट ब्रांच: APK को "apk-test" ब्रांच में रख दो (डाउनलोड आसान)
      - name: Save test APK
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir out && cp ScanHelper/app/build/outputs/apk/debug/app-debug.apk out/ScanHelper-test.apk
          cd out && git init -q && git checkout -q -b apk-test
          git add ScanHelper-test.apk
          git -c user.name=ci -c user.email=ci@local commit -qm "test apk ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-test

      # नया APK public "ScanHelper-releases" repo में डालता है,
      # जहाँ से ग्राहकों के फ़ोन अपने आप अपडेट उठाते हैं
      - name: Publish update
        # सिर्फ़ main ब्रांच से ग्राहकों तक अपडेट जाए; टेस्ट ब्रांच से सिर्फ़ APK बने
        if: env.RELEASES_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ github.repository_owner }}/ScanHelper-releases
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.${GITHUB_RUN_NUMBER}"
          git log -1 --pretty=%B > msg.txt
          cp ScanHelper/app/build/outputs/apk/debug/app-debug.apk ScanHelper.apk
          python3 - "$CODE" "$NAME" <<'PY'
          import json, re, sys
          code, name = int(sys.argv[1]), sys.argv[2]
          msg = open("msg.txt", encoding="utf-8").read().strip()
          force = bool(re.search(r"zaroori|zaruri|jaruri|force|ज़रूरी|जरूरी", msg, re.I))
          notes = "" if msg.lower().startswith("add files via upload") else msg
          json.dump({"versionCode": code, "versionName": name, "notes": notes, "force": force},
                    open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(open("version.json", encoding="utf-8").read())
          PY
          gh release create "v$CODE" ScanHelper.apk version.json \
            --repo "$RELEASES_REPO" --title "Scan Helper $NAME" --notes-file msg.txt --latest \
          || gh release upload "v$CODE" ScanHelper.apk version.json --repo "$RELEASES_REPO" --clobber
